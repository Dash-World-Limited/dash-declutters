# declutters.dashworldng.com — the Next.js web app.
#
# Install to /etc/nginx/sites-available/declutters and symlink into
# sites-enabled. Run `nginx -t` before every reload, without exception.
#
# certbot rewrites this block when it issues a certificate. What is here is the
# pre-TLS state; do not paste it back over a certbot-managed file.

server {
    listen 80;
    listen [::]:80;
    server_name declutters.dashworldng.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        # Port 3000 is fixed. apps/web/package.json pins `next start --port
        # 3000` and the PORT environment variable does not change it.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
