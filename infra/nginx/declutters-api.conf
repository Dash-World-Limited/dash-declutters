# api.dashworldng.com — the Fastify API.
#
# Must stay under dashworldng.com. The API sends
# Cross-Origin-Resource-Policy: same-site, so moving it to an unrelated domain
# blocks every item photograph.

server {
    listen 80;
    listen [::]:80;
    server_name api.dashworldng.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Listing photographs are uploaded through here. The 1m default would
    # reject a seller's photo with a 413 and no useful message.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
